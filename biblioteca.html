<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>biblioteca</title>
    <!-- style.css primero (local, chico): pinta el fondo punteado y los libros
         al instante. El CDN de Tailwind va con defer para que NO bloquee el
         primer paint (antes tardaba en aparecer todo por esperarlo). -->
    <link rel="stylesheet" href="./src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Alegreya:wght@500;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<div class="flex flex-wrap justify-center">
    <main class="p-4 w-full md:w-2/3 coral-pixels-regular">
        <div class="flex items-baseline gap-4 mb-6">
            <h1 class="text-3xl">biblioteca</h1>
            <a href="./index.html" class="text-lg hover:underline">volver al blog</a>
        </div>
        <div id="shelf-container" class="flex flex-col gap-8"></div>
    </main>
</div>

<script type="module">
  import { renderBiblioteca } from './src/render_biblioteca.js'

  const jsonFile = await fetch('./src/biblioteca.json')
  const books = await jsonFile.json()

  const container = document.getElementById('shelf-container')

  if (books.length === 0) {
    const empty = document.createElement('p')
    empty.className = 'text-lg text-gray-500'
    empty.innerText = 'todavía no hay libros acá.'
    container.appendChild(empty)
  } else {
    renderBiblioteca(books, container)
  }
</script>
