<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./src/style.css">
    <!---->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&display=swap" rel="stylesheet">
</head>

<div class="flex justify-center">
    <main class="p-4 w-full coral-pixels-regular">
        <h1 class="text-3xl mb-6">blog</h1>
        <ul id="container" class="flex flex-col gap-3 text-xl"></ul>
    </main>
</div>

<script type="module">
  const jsonFile = await fetch('./src/posts.json')
  const posts = await jsonFile.json()

  const container = document.getElementById('container')

  const visited = JSON.parse(localStorage.getItem('visitedPosts') || '[]')

  posts
    .filter(post => !post.hidden)
    .forEach(post => {
      const postElement = document.createElement('li')
      const link = document.createElement('a')
      link.href = `./post.html?slug=${post.id}`
      link.innerText = post.date
      link.className = 'hover:underline'
      if (visited.includes(post.id)) link.classList.add('visited')
      postElement.appendChild(link)
      container.appendChild(postElement)
    });

  // restaurar scroll al volver
  const savedScroll = sessionStorage.getItem('indexScroll')
  if (savedScroll) window.scrollTo(0, parseInt(savedScroll))

  window.addEventListener('beforeunload', () => {
    sessionStorage.setItem('indexScroll', window.scrollY)
  })
</script>
