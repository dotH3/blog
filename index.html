<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./src/assets/vendor/jsmediatags.min.js"></script>
    <link rel="stylesheet" href="./src/style.css">
    <!---->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&display=swap" rel="stylesheet">
</head>

<div class="flex flex-wrap justify-center">
    <main class="p-4 w-full md:w-1/2 coral-pixels-regular">
        <div class="flex items-baseline gap-4 mb-6">
            <h1 class="text-3xl">blog</h1>
            <a href="./biblioteca.html" class="text-lg hover:underline">biblioteca</a>
        </div>
        <div id="container" class="flex flex-col gap-10"></div>
    </main>

    <!-- Comentarios globales (libro de visitas) con forma de chat de stream:
         en desktop quedan fijos en el margen derecho (los más nuevos abajo) y
         en mobile se abren como modal desde el botón flotante de acá abajo.
         Ver .comments-gutter en style.css; comments.js cablea la lógica. -->
    <section id="comments" class="comments-gutter p-4 flex flex-col gap-2 coral-pixels-regular">
        <div class="flex items-baseline justify-between shrink-0">
            <h2 class="text-xl">comentarios</h2>
            <button id="comments-close" type="button" aria-label="cerrar comentarios"
                class="border border-black rounded px-2 leading-none py-1">x</button>
        </div>
        <div id="comment-list" class="flex flex-col gap-1 text-base"></div>
        <form id="comment-form" class="flex flex-col gap-1 shrink-0" autocomplete="off">
            <input id="c-username" type="text" placeholder="tu nombre" maxlength="32" required
                class="border border-black rounded px-2 py-1 bg-white text-base" />
            <textarea id="c-message" placeholder="dejá algo..." maxlength="250" required rows="2"
                class="border border-black rounded px-2 py-1 bg-white resize-none text-base"></textarea>
            <div class="flex items-center gap-2">
                <button type="submit" class="border border-black rounded px-3 py-1 hover:underline disabled:opacity-50">enviar</button>
                <span id="comment-status" class="text-sm text-gray-500"></span>
            </div>
        </form>
    </section>
</div>

<!-- Solo mobile: botón flotante que abre el modal de comentarios. En desktop
     no hace falta porque el chat ya está fijo en el margen derecho. -->
<button id="comments-open" type="button"
    class="fixed bottom-4 right-4 z-40 border-2 border-black rounded-full bg-white px-4 py-2 text-lg coral-pixels-regular shadow-md">
    comentarios
</button>
<div id="comments-backdrop" class="fixed inset-0 z-30 bg-black/50 hidden"></div>

<!-- Modal de key: decrypt_music.js espera estos selectores (#key-modal, .sp-unlock, .sp-key, etc.) -->
<dialog id="key-modal" class="p-4 border-2 border-black rounded coral-pixels-regular backdrop:bg-black/50">
    <form class="sp-unlock flex flex-col gap-2" method="dialog" autocomplete="off">
        <div class="sp-unlock-title text-lg"></div>
        <input class="sp-key border border-black rounded px-2 py-1" type="text" placeholder="key" />
        <div class="sp-unlock-actions flex gap-2">
            <button type="submit" class="sp-unlock-go border border-black rounded px-2 hover:underline">disfrutar</button>
            <button type="button" class="sp-unlock-cancel border border-black rounded px-2 hover:underline">?</button>
        </div>
        <span class="sp-unlock-status"></span>
    </form>
</dialog>

<script type="module">
  import { renderPostContent, loadSongMetadata } from './src/render_post.js'
  import { mountComments } from './src/comments.js'
  window.loadSongMetadata = loadSongMetadata

  const jsonFile = await fetch('./src/posts.json')
  const posts = await jsonFile.json()

  const container = document.getElementById('container')

  const visited = JSON.parse(localStorage.getItem('visitedPosts') || '[]')

  posts
    .filter(post => !post.hidden)
    .forEach(post => {
      const article = document.createElement('article')
      article.className = 'flex flex-col gap-2 text-lg'

      // La fecha sigue siendo el permalink al post individual.
      const heading = document.createElement('h2')
      const link = document.createElement('a')
      link.href = `./post.html?slug=${post.id}`
      link.innerText = post.date
      link.className = 'text-xl hover:underline'
      if (visited.includes(post.id)) link.classList.add('visited')
      heading.appendChild(link)
      article.appendChild(heading)

      renderPostContent(post, article)
      container.appendChild(article)
    });

  mountComments(document.getElementById('comments'))

  // Modal de comentarios en mobile (en desktop el botón está oculto por CSS).
  const backdrop = document.getElementById('comments-backdrop')
  const setCommentsOpen = (open) => {
    document.body.classList.toggle('comments-open', open)
    backdrop.classList.toggle('hidden', !open)
  }
  document.getElementById('comments-open').addEventListener('click', () => {
    setCommentsOpen(true)
    // Recién visible: pegar el chat abajo, como al abrir cualquier chat.
    const list = document.getElementById('comment-list')
    list.scrollTop = list.scrollHeight
  })
  document.getElementById('comments-close').addEventListener('click', () => setCommentsOpen(false))
  backdrop.addEventListener('click', () => setCommentsOpen(false))
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') setCommentsOpen(false)
  })

  // restaurar scroll al volver
  const savedScroll = sessionStorage.getItem('indexScroll')
  if (savedScroll) window.scrollTo(0, parseInt(savedScroll))

  window.addEventListener('beforeunload', () => {
    sessionStorage.setItem('indexScroll', window.scrollY)
  })
</script>

<script src="./src/assets/audios/decrypt_music.js"></script>
